name: On-call validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECKPOINT_DISABLE: '1'
      TF_IN_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialise local validation
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate
      - name: Run plan-only tests
        run: terraform test -no-color

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Test alert quality metrics
        run: python -m pytest
      - name: Check Python lint, format, and types
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy --strict quality

  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, python]
    if: ${{ always() }}
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: test "$VALIDATION_RESULT" = success && test "$PYTHON_RESULT" = success
