name: On-call validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECKPOINT_DISABLE: '1'
      TF_IN_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialise local validation
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate
      - name: Run plan-only tests
        run: terraform test -no-color

  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    if: ${{ always() }}
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
